name: CI
on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: voltpak_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NOTIFY_SIGNING_SECRET: ci-only-secret
      NEXT_TELEMETRY_DISABLED: "1"
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/voltpak_test
      PAYLOAD_SECRET: ci-only-payload-secret-do-not-use-in-production
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Push Payload schema to CI database
        run: NODE_ENV=development node --import tsx/esm scripts/db-push.mts
      - run: npm run build
      - name: Smoke test production server
        run: |
          npx next start -p 3000 &
          npx --yes wait-on http://localhost:3000 --timeout 60000
          BASE_URL=http://localhost:3000 npm run smoke
      - name: Audit (production deps, informational)
        run: npm audit --omit=dev || true
